# Refreshes the data once a day, commits what changed and publishes the site
# to GitHub Pages. Also runs on every push to the default branch, whatever
# its name (pushes to other branches are ignored by the job condition).
name: Update data and deploy

on:
  schedule:
    - cron: '17 5 * * *' # every day at 05:17 UTC
  push:
  workflow_dispatch:
    inputs:
      skip_data:
        description: Deploy without refreshing the data
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Refresh data
        if: github.event_name != 'push' && inputs.skip_data != true
        run: |
          pip install -r requirements.txt
          python pipeline/update.py

      - name: Commit data changes
        if: github.event_name != 'push' && inputs.skip_data != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_TALLY_FORM_ID: ${{ vars.PUBLIC_TALLY_FORM_ID }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
